spring:
  application:
    name: turnos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turnos}
    username: ${DB_USER:turnos}
    password: ${DB_PASSWORD:turnos}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
